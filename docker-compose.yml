services:
  mongo:
    image: mongo:7
    container_name: pulse-mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7
    container_name: pulse-redis
    ports:
      - '6379:6379'

  temporal:
    image: temporalio/auto-setup:latest
    container_name: pulse-temporal
    depends_on:
      - temporal-db
      - temporal-elasticsearch
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-db
      - ENABLE_ES=true
      - ES_SEEDS=temporal-elasticsearch
      - ES_VERSION=v7
    ports:
      - '7233:7233'

  temporal-db:
    image: postgres:15
    container_name: pulse-temporal-db
    environment:
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_DB=temporal
    ports:
      - '5432:5432'

  temporal-elasticsearch:
    image: elasticsearch:7.16.3
    container_name: pulse-temporal-es
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
    ports:
      - '9200:9200'

  temporal-ui:
    image: temporalio/ui:latest
    container_name: pulse-temporal-ui
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - '8080:8080'

volumes:
  mongo-data:
